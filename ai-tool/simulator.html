<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Grand Line Reels — AI Session Simulator</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@700&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">

<style>

*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#060D1A;
  --navy-mid:#0F1F38;
  --gold:#C9973A;
  --gold-bright:#F0C060;
  --white:#F0EDE8;
  --gray:#777;
  --green:#6FFF90;
  --red:#FF6060;
  --teal:#2ABBA8;
}

body{
  background:var(--navy);
  color:var(--white);
  font-family:'Crimson Text',serif;
  min-height:100vh;
  padding:32px 16px 80px;
}

#app{
  max-width:960px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:24px;
}

header{
  text-align:center;
  padding-bottom:18px;
  border-bottom:1px solid rgba(201,151,58,0.2);
}

#anchor{
  font-size:2rem;
  color:var(--gold);
}

h1{
  font-family:'Cinzel Decorative',serif;
  color:var(--gold-bright);
  letter-spacing:4px;
  margin-top:8px;
}

.subtitle{
  color:var(--gray);
  margin-top:8px;
  font-style:italic;
}

#config{
  background:rgba(15,31,56,0.85);
  border:1px solid rgba(201,151,58,0.2);
  border-radius:12px;
  padding:24px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

@media(max-width:700px){
  #config{
    grid-template-columns:1fr;
  }
}

.config-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.config-group label{
  font-family:'Cinzel',serif;
  font-size:0.65rem;
  letter-spacing:2px;
  color:var(--gray);
}

.config-group input,
.config-group select{
  background:#091220;
  border:1px solid rgba(201,151,58,0.25);
  border-radius:6px;
  padding:12px;
  color:var(--white);
  font-size:1rem;
}

.config-group input:focus,
.config-group select:focus{
  outline:none;
  border-color:rgba(201,151,58,0.6);
}

#paytable-display{
  grid-column:1/-1;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;
  padding:18px;
}

#paytable-display h3{
  font-family:'Cinzel',serif;
  color:var(--gold);
  font-size:0.75rem;
  letter-spacing:3px;
  margin-bottom:14px;
}

.pt-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:10px;
}

.pt-item{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:6px;
  padding:10px;
  display:flex;
  justify-content:space-between;
}

.pt-label{
  color:rgba(240,220,190,0.75);
}

.pt-val{
  color:var(--gold-bright);
  font-family:'Cinzel',serif;
}

#run-btn{
  align-self:center;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#C9973A,#A07828);
  color:var(--navy);
  font-family:'Cinzel',serif;
  font-size:1rem;
  letter-spacing:3px;
  padding:16px 42px;
  cursor:pointer;
  font-weight:700;
}

#run-btn:hover{
  transform:scale(1.02);
}

#status{
  text-align:center;
  color:var(--gold);
}

.hidden{
  display:none;
}

#output{
  display:flex;
  flex-direction:column;
  gap:24px;
}

.panel{
  background:rgba(15,31,56,0.85);
  border:1px solid rgba(201,151,58,0.2);
  border-radius:12px;
  padding:24px;
}

.panel h2{
  font-family:'Cinzel',serif;
  color:var(--gold);
  font-size:0.75rem;
  letter-spacing:3px;
  margin-bottom:18px;
  padding-bottom:10px;
  border-bottom:1px solid rgba(201,151,58,0.15);
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
}

.summary-stat{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:8px;
  padding:14px;
  text-align:center;
}

.s-label{
  display:block;
  font-family:'Cinzel',serif;
  font-size:0.55rem;
  letter-spacing:2px;
  color:var(--gray);
  margin-bottom:6px;
}

.s-val{
  font-family:'Cinzel',serif;
  font-size:1.15rem;
  color:var(--gold-bright);
}

#narrative{
  line-height:1.8;
}

.event{
  margin-bottom:12px;
  padding-left:16px;
  border-left:2px solid rgba(201,151,58,0.25);
}

.win{
  border-left-color:var(--green);
}

.loss{
  border-left-color:var(--red);
}

.emotion-tag{
  display:inline-block;
  font-size:0.6rem;
  padding:2px 8px;
  border-radius:10px;
  margin-right:8px;
  font-family:'Cinzel',serif;
  letter-spacing:2px;
}

.em-curious{background:rgba(42,187,168,0.15);color:var(--teal);}
.em-excited{background:rgba(240,192,96,0.15);color:var(--gold-bright);}
.em-relief{background:rgba(111,255,144,0.15);color:var(--green);}
.em-focused{background:rgba(201,151,58,0.15);color:var(--gold);}
.em-tense{background:rgba(255,96,96,0.15);color:var(--red);}
.em-frustrated{background:rgba(255,96,96,0.2);color:var(--red);}
.em-elated{background:rgba(42,187,168,0.25);color:var(--teal);}
.em-resigned{background:rgba(120,120,120,0.2);color:#bbb;}

</style>
</head>

<body>

<div id="app">

<header>
  <div id="anchor">⚓</div>
  <h1>GRAND LINE REELS</h1>
  <p class="subtitle">
    AI Emotional Session Simulator
  </p>
</header>

<div id="config">

  <div class="config-group" style="grid-column:1/-1">
    <label>Anthropic API Key</label>
    <input type="password" id="api-key" placeholder="sk-ant-...">
  </div>

  <div class="config-group">
    <label>Starting Bankroll</label>
    <input type="number" id="bankroll" value="100">
  </div>

  <div class="config-group">
    <label>Bet Size</label>
    <select id="bet-size">
      <option value="1">$1</option>
      <option value="3">$3</option>
      <option value="5">$5</option>
    </select>
  </div>

  <div class="config-group">
    <label>Number of Spins</label>
    <input type="number" id="num-spins" value="300">
  </div>

  <div class="config-group">
    <label>Session Seed</label>
    <input type="number" id="seed" placeholder="Random">
  </div>

  <div id="paytable-display">
    <h3>ACTIVE PAYTABLE — GRAND LINE REELS</h3>
    <div class="pt-grid"></div>
  </div>

</div>

<button id="run-btn">
  ⚓ RUN SESSION
</button>

<div id="status"></div>

<div id="output" class="hidden">

  <div class="panel">
    <h2>SESSION STATISTICS</h2>
    <div class="summary-grid" id="summary-grid"></div>
  </div>

  <div class="panel">
    <h2>MARCO'S SESSION NARRATIVE</h2>
    <div id="narrative"></div>
  </div>

</div>

</div>

<script>

// ───────────────── GAME CONFIG ─────────────────

const REEL = [
  'M','M','M','M','M','M',
  'W','W','W','W','W',
  'C','C','C','C',
  'D','D',
  'S','S',
  'B','B','B'
];

const PAYTABLE = {
  '3M':8,
  '3W':15,
  '3C':40,
  '3D':45,
  '2M':3,
  '2W':3
};

const CHEST_POOL = [2,2,2,2,3,3,3,5,5];

// ───────────────── PAYTABLE ─────────────────

function updatePaytableDisplay(bet){

  const vals = {
    '3M':8*bet,
    '3W':15*bet,
    '3C':40*bet,
    '3D':45*bet,
    '2M':3*bet,
    '2W':3*bet
  };

  document.querySelector('.pt-grid').innerHTML = `
    <div class="pt-item"><span class="pt-label">🍖 Three Meat</span><span class="pt-val">$${vals['3M']}</span></div>
    <div class="pt-item"><span class="pt-label">📜 Three Wanted</span><span class="pt-val">$${vals['3W']}</span></div>
    <div class="pt-item"><span class="pt-label">💰 Three Chests</span><span class="pt-val">$${vals['3C']}</span></div>
    <div class="pt-item"><span class="pt-label">🍇 Devil Fruit</span><span class="pt-val">$${vals['3D']}</span></div>
    <div class="pt-item"><span class="pt-label">🍖🍖 Two Meat</span><span class="pt-val">$${vals['2M']}</span></div>
    <div class="pt-item"><span class="pt-label">📜📜 Two Wanted</span><span class="pt-val">$${vals['2W']}</span></div>
    <div class="pt-item"><span class="pt-label">🎩🎩🎩 Straw Hat</span><span class="pt-val">BONUS</span></div>
  `;
}

// ───────────────── RNG ─────────────────

function seededRandom(seed){

  let s = seed;

  return function(){
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  };
}

// ───────────────── SIMULATION ─────────────────

function simulateSession(bankroll,numSpins,seed,bet){

  const rand = seed
    ? seededRandom(seed)
    : Math.random.bind(Math);

  let balance = bankroll;

  let spinsPlayed = 0;
  let totalWon = 0;
  let biggestWin = 0;

  let drySpell = 0;
  let maxDrySpell = 0;

  let bonusTriggered = false;

  const events = [];

  let wins = {
    total:0,
    bonus:0,
    '3M':0,
    '3W':0,
    '3C':0,
    '3D':0,
    '2M':0,
    '2W':0
  };

  for(let spin=1; spin<=numSpins; spin++){

    if(balance < bet){
      break;
    }

    spinsPlayed++;

    balance -= bet;

    const reels = [0,1,2].map(() =>
      REEL[Math.floor(rand()*REEL.length)]
    );

    let win = 0;
    let winType = null;

    // BONUS

    if(
      reels[0]==='S' &&
      reels[1]==='S' &&
      reels[2]==='S'
    ){

      const pool = [...CHEST_POOL]
        .sort(() => rand()-0.5);

      const picks = pool.slice(0,3);

      const mult =
        picks.reduce((a,b)=>a+b,0);

      win = mult * bet;

      winType = 'BONUS';

      wins.bonus++;
      wins.total++;

      bonusTriggered = true;
    }

    // 3 MATCH

    else if(
      reels[0] !== 'B' &&
      reels[0]===reels[1] &&
      reels[1]===reels[2]
    ){

      const key = '3'+reels[0];

      if(PAYTABLE[key]){

        win = PAYTABLE[key] * bet;
        winType = key;

        wins[key]++;
        wins.total++;
      }
    }

    // 2 MATCH

    else if(
      reels[0] !== 'B' &&
      reels[0]===reels[1] &&
      reels[2]!==reels[0]
    ){

      const key = '2'+reels[0];

      if(PAYTABLE[key]){

        win = PAYTABLE[key] * bet;
        winType = key;

        wins[key]++;
        wins.total++;
      }
    }

    balance += win;
    totalWon += win;

    if(win > biggestWin){
      biggestWin = win;
    }

    if(win === 0){

      drySpell++;

      if(drySpell > maxDrySpell){
        maxDrySpell = drySpell;
      }

    } else {

      drySpell = 0;
    }

    const important =
      win > 0 ||
      drySpell === 10 ||
      drySpell === 20 ||
      drySpell === 30 ||
      spin === 1 ||
      spin % 50 === 0;

    if(important){

      events.push({
        spin,
        balance:Math.round(balance*100)/100,
        win,
        winType,
        drySpell
      });
    }
  }

  const totalWagered =
    spinsPlayed * bet;

  const realizedRTP =
    totalWagered > 0
      ? (totalWon / totalWagered) * 100
      : 0;

  return {

    startingBalance:bankroll,

    finalBalance:
      Math.round(balance*100)/100,

    spinsPlayed,

    totalWon:
      Math.round(totalWon*100)/100,

    totalWagered:
      Math.round(totalWagered*100)/100,

    realizedRTP:
      Math.round(realizedRTP*100)/100,

    biggestWin:
      Math.round(biggestWin*100)/100,

    maxDrySpell,

    bonusTriggered,

    wins,

    events
  };
}

// ───────────────── CLAUDE ─────────────────

async function callClaude(session){

  const apiKey =
    document.getElementById('api-key')
    .value
    .trim();

  const prompt = `
You are Marco, a 28-year-old anime fan playing a One Piece themed slot machine called Grand Line Reels.

Write a first-person emotional gambling session narrative.

Use emotional tags:
[CURIOUS]
[EXCITED]
[RELIEF]
[FOCUSED]
[TENSE]
[FRUSTRATED]
[ELATED]
[RESIGNED]

SESSION DATA:

Starting Balance:
$${session.startingBalance}

Final Balance:
$${session.finalBalance}

Spins Played:
${session.spinsPlayed}

Total Wagered:
$${session.totalWagered}

Realized RTP:
${session.realizedRTP}%

Biggest Win:
$${session.biggestWin}

Longest Dry Spell:
${session.maxDrySpell}

EVENTS:
${session.events.map(e => `
Spin ${e.spin}
Balance: $${e.balance}
${e.win > 0
  ? `Win: $${e.win} (${e.winType})`
  : `Dry Spell: ${e.drySpell}`
}
`).join('\n')}
`;

  const response = await fetch(
    'https://api.anthropic.com/v1/messages',
    {
      method:'POST',

      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },

      body:JSON.stringify({

        model:'claude-sonnet-4-20250514',

        max_tokens:900,

        messages:[
          {
            role:'user',
            content:prompt
          }
        ]
      })
    }
  );

  const data = await response.json();

  if(data.error){
    throw new Error(data.error.message);
  }

  return data.content[0].text;
}

// ───────────────── SUMMARY ─────────────────

function renderSummary(session){

  const grid =
    document.getElementById('summary-grid');

  grid.innerHTML = [

    ['Spins Played',session.spinsPlayed],
    ['Starting Balance','$'+session.startingBalance],
    ['Final Balance','$'+session.finalBalance],
    ['Total Wagered','$'+session.totalWagered],
    ['Total Returned','$'+session.totalWon],
    ['Realized RTP',session.realizedRTP + '%'],
    ['Biggest Win','$'+session.biggestWin],
    ['Longest Dry Spell',session.maxDrySpell],
    ['Bonus Triggered',
      session.bonusTriggered ? 'YES':'NO'
    ],
    ['Total Wins',session.wins.total]

  ].map(([label,val]) => `

    <div class="summary-stat">

      <span class="s-label">
        ${label}
      </span>

      <span class="s-val">
        ${val}
      </span>

    </div>

  `).join('');
}

// ───────────────── NARRATIVE ─────────────────

function renderNarrative(text){

  const emotionMap = {
    '[CURIOUS]':'em-curious',
    '[EXCITED]':'em-excited',
    '[RELIEF]':'em-relief',
    '[FOCUSED]':'em-focused',
    '[TENSE]':'em-tense',
    '[FRUSTRATED]':'em-frustrated',
    '[ELATED]':'em-elated',
    '[RESIGNED]':'em-resigned'
  };

  const html = text
    .split('\n')
    .filter(line => line.trim())
    .map(line => {

      let cls = 'event';
      let formatted = line;

      Object.entries(emotionMap)
      .forEach(([tag,emotionClass]) => {

        if(line.includes(tag)){

          formatted = formatted.replace(
            tag,
            `<span class="emotion-tag ${emotionClass}">
              ${tag.replace(/[\[\]]/g,'')}
            </span>`
          );

          if(
            emotionClass.includes('excited') ||
            emotionClass.includes('relief') ||
            emotionClass.includes('elated')
          ){
            cls += ' win';
          }

          if(
            emotionClass.includes('tense') ||
            emotionClass.includes('frustrated')
          ){
            cls += ' loss';
          }
        }
      });

      return `
        <div class="${cls}">
          ${formatted}
        </div>
      `;
    })
    .join('');

  document.getElementById('narrative').innerHTML =
    html;
}

// ───────────────── MAIN ─────────────────

async function runSimulation(){

  const bankroll =
    parseFloat(
      document.getElementById('bankroll').value
    ) || 100;

  const bet =
    parseFloat(
      document.getElementById('bet-size').value
    );

  const numSpins =
    parseInt(
      document.getElementById('num-spins').value
    ) || 300;

  const seed =
    parseInt(
      document.getElementById('seed').value
    ) || null;

  const status =
    document.getElementById('status');

  const btn =
    document.getElementById('run-btn');

  const output =
    document.getElementById('output');

  const apiKey =
    document.getElementById('api-key')
    .value
    .trim();

  if(!apiKey.startsWith('sk-ant-')){

    status.textContent =
      'Please enter a valid Anthropic API key.';

    return;
  }

  btn.disabled = true;

  status.textContent =
    'Simulating session...';

  output.classList.add('hidden');

  try{

    const session =
      simulateSession(
        bankroll,
        numSpins,
        seed,
        bet
      );

    renderSummary(session);

    status.textContent =
      'Generating AI narrative...';

    const narrative =
      await callClaude(session);

    renderNarrative(narrative);

    output.classList.remove('hidden');

    status.textContent =
      `Session complete. ${session.spinsPlayed} spins simulated.`;

  } catch(err){

    console.error(err);

    status.textContent =
      'Error: ' + err.message;

  } finally {

    btn.disabled = false;
  }
}

// ───────────────── INIT ─────────────────

document
  .getElementById('bet-size')
  .addEventListener('change', e => {

    updatePaytableDisplay(
      parseFloat(e.target.value)
    );
  });

document
  .getElementById('run-btn')
  .addEventListener('click', runSimulation);

updatePaytableDisplay(1);

</script>

</body>
</html>
