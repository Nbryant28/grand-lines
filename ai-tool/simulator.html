<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Line Reels — Player Agent</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#060D1A;
  --navy-mid:#0F1F38;
  --navy-light:#162840;
  --gold:#C9973A;
  --gold-bright:#F0C060;
  --teal:#2ABBA8;
  --white:#F0EDE8;
  --gray:#6A6860;
  --red:#FF6060;
  --green:#6FFF90;
}

body{
  background:var(--navy);
  color:var(--white);
  font-family:'Crimson Text',serif;
  min-height:100vh;
  padding:32px 16px 60px;
}

#app{
  max-width:860px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:24px;
}

/* HEADER */
header{
  text-align:center;
  padding-bottom:20px;
  border-bottom:1px solid rgba(201,151,58,0.2);
}

#anchor{
  font-size:2rem;
  color:var(--gold);
  display:inline-block;
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

h1{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.2rem,4vw,1.8rem);
  color:var(--gold-bright);
  letter-spacing:4px;
  margin:8px 0 4px;
  text-shadow:0 0 20px rgba(240,192,96,0.4);
}

.subtitle{
  font-style:italic;
  color:var(--gray);
  font-size:0.95rem;
}

/* CONFIG */
#config{
  background:rgba(15,31,56,0.8);
  border:1px solid rgba(201,151,58,0.2);
  border-radius:12px;
  padding:24px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

@media(max-width:600px){
  #config{
    grid-template-columns:1fr;
  }
}

.config-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.config-group label{
  font-family:'Cinzel',serif;
  font-size:0.65rem;
  letter-spacing:2px;
  color:var(--gray);
}

.config-group input,
.config-group select{
  background:rgba(6,13,26,0.8);
  border:1px solid rgba(201,151,58,0.25);
  border-radius:6px;
  color:var(--white);
  font-family:'Crimson Text',serif;
  font-size:1rem;
  padding:10px 12px;
  outline:none;
}

.config-group input:focus,
.config-group select:focus{
  border-color:rgba(201,151,58,0.6);
}

.config-group select option{
  background:var(--navy-mid);
}

/* PAYTABLE */
#paytable-display{
  background:rgba(15,31,56,0.5);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:8px;
  padding:16px;
  grid-column:1/-1;
}

#paytable-display h3{
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:3px;
  color:var(--gold);
  margin-bottom:12px;
}

.pt-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:8px;
}

.pt-item{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:6px;
  padding:8px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.pt-label{
  font-size:0.85rem;
  color:rgba(240,220,190,0.7);
}

.pt-val{
  font-family:'Cinzel',serif;
  font-size:0.8rem;
  font-weight:700;
  color:var(--gold-bright);
}

/* BUTTON */
#run-btn{
  background:linear-gradient(135deg,#C9973A,#A07828);
  color:var(--navy);
  border:none;
  border-radius:10px;
  padding:16px 40px;
  font-family:'Cinzel',serif;
  font-size:1rem;
  font-weight:700;
  letter-spacing:3px;
  cursor:pointer;
  align-self:center;
}

#run-btn:hover:not(:disabled){
  transform:scale(1.03);
}

#run-btn:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

/* STATUS */
#status{
  text-align:center;
  color:var(--gold);
  min-height:24px;
}

/* OUTPUT */
#output{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.hidden{
  display:none;
}

/* SUMMARY */
#sim-summary,
#narrative-container,
#arc-container{
  background:rgba(15,31,56,0.8);
  border:1px solid rgba(201,151,58,0.2);
  border-radius:12px;
  padding:24px;
}

#sim-summary h2,
#narrative-container h2,
#arc-container h2{
  font-family:'Cinzel',serif;
  font-size:0.75rem;
  letter-spacing:3px;
  color:var(--gold);
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:1px solid rgba(201,151,58,0.15);
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}

.summary-stat{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:8px;
  padding:12px;
  text-align:center;
}

.s-label{
  display:block;
  margin-bottom:4px;
  font-family:'Cinzel',serif;
  font-size:0.55rem;
  letter-spacing:2px;
  color:var(--gray);
}

.s-val{
  font-family:'Cinzel',serif;
  font-size:1.1rem;
  color:var(--gold-bright);
}

#narrative{
  line-height:1.8;
}

.phase-header{
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:3px;
  color:var(--teal);
  margin:20px 0 10px;
  display:block;
}

.event{
  margin-bottom:12px;
  padding-left:16px;
  border-left:2px solid rgba(201,151,58,0.2);
}

.event.win{
  border-left-color:var(--green);
}

.event.loss{
  border-left-color:var(--red);
}

.emotion-tag{
  font-family:'Cinzel',serif;
  font-size:0.6rem;
  letter-spacing:2px;
  padding:2px 8px;
  border-radius:10px;
  margin-right:8px;
}

.em-curious{background:rgba(42,187,168,0.15);color:var(--teal)}
.em-excited{background:rgba(240,192,96,0.15);color:var(--gold-bright)}
.em-relief{background:rgba(111,255,144,0.15);color:var(--green)}
.em-focused{background:rgba(201,151,58,0.15);color:var(--gold)}
.em-tense{background:rgba(255,96,96,0.15);color:var(--red)}
.em-frustrated{background:rgba(255,96,96,0.2);color:var(--red)}
.em-elated{background:rgba(42,187,168,0.25);color:var(--teal)}
.em-resigned{background:rgba(106,104,96,0.3);color:var(--gray)}

.dot-loader{
  display:inline-flex;
  gap:6px;
}

.dot-loader span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--gold);
  animation:dotPulse 1.2s ease-in-out infinite;
}

.dot-loader span:nth-child(2){animation-delay:0.2s}
.dot-loader span:nth-child(3){animation-delay:0.4s}

@keyframes dotPulse{
  0%,80%,100%{
    opacity:0.2;
    transform:scale(0.8);
  }
  40%{
    opacity:1;
    transform:scale(1);
  }
}
</style>
</head>

<body>

<div id="app">

<header>
  <div id="anchor">⚓</div>
  <h1>GRAND LINE REELS</h1>
  <p class="subtitle">Player Agent — Session Simulator with Emotional Reporting</p>
</header>

<div id="config">

  <div class="config-group" style="grid-column:1/-1">
    <label>Anthropic API Key</label>
    <input type="password" id="api-key" placeholder="sk-ant-...">
  </div>

  <div class="config-group">
    <label>Starting Bankroll</label>
    <input type="number" id="bankroll" value="100.00" min="5" step="1">
  </div>

  <div class="config-group">
    <label>Bet Size</label>
    <select id="bet-size">
      <option value="1">$1</option>
      <option value="3">$3</option>
      <option value="5">$5</option>
    </select>
  </div>

  <div class="config-group">
    <label>Number of Spins</label>
    <input type="number" id="num-spins" value="300" min="50" max="1000" step="50">
  </div>

  <div class="config-group">
    <label>Session Seed</label>
    <input type="number" id="seed" placeholder="Random">
  </div>

  <div class="config-group">
    <label>Report Detail</label>
    <select id="detail">
      <option value="standard">Standard</option>
      <option value="detailed">Detailed</option>
    </select>
  </div>

  <div id="paytable-display">
    <h3>ACTIVE PAYTABLE — GRAND LINE REELS</h3>
    <div class="pt-grid"></div>
  </div>

</div>

<button id="run-btn" onclick="runSimulation()">⚓ RUN SESSION</button>

<div id="status"></div>

<div id="output" class="hidden">

  <div id="sim-summary">
    <h2>SESSION STATISTICS</h2>
    <div class="summary-grid" id="summary-grid"></div>
  </div>

  <div id="narrative-container">
    <h2>MARCO'S SESSION — FIRST PERSON NARRATIVE</h2>
    <div id="narrative"></div>
  </div>

  <div id="arc-container">
    <h2>EMOTIONAL ARC ANALYSIS</h2>
    <div id="arc-text"></div>
  </div>

</div>

</div>

<script>

// ───────────────── GAME MATH ─────────────────

const REEL = [
  'M','M','M','M','M','M',
  'W','W','W','W','W',
  'C','C','C','C',
  'D','D',
  'S','S',
  'B','B','B'
];

const PAYTABLE = {
  '3M':8,
  '3W':15,
  '3C':40,
  '3D':45,
  '2M':3,
  '2W':3
};

const CHEST_POOL = [2,2,2,2,3,3,3,5,5];

function updatePaytableDisplay(bet){

  const values = {
    '3M':8 * bet,
    '3W':15 * bet,
    '3C':40 * bet,
    '3D':45 * bet,
    '2M':3 * bet,
    '2W':3 * bet
  };

  document.querySelector('.pt-grid').innerHTML = `
    <div class="pt-item"><span class="pt-label">🍖 Three Meat</span><span class="pt-val">8× · $${values['3M'].toFixed(2)}</span></div>
    <div class="pt-item"><span class="pt-label">📜 Three Wanted</span><span class="pt-val">15× · $${values['3W'].toFixed(2)}</span></div>
    <div class="pt-item"><span class="pt-label">💰 Three Chests</span><span class="pt-val">40× · $${values['3C'].toFixed(2)}</span></div>
    <div class="pt-item"><span class="pt-label">🍇 Devil Fruit</span><span class="pt-val">45× · $${values['3D'].toFixed(2)}</span></div>
    <div class="pt-item"><span class="pt-label">🍖🍖 Two Meat</span><span class="pt-val">3× · $${values['2M'].toFixed(2)}</span></div>
    <div class="pt-item"><span class="pt-label">📜📜 Two Wanted</span><span class="pt-val">3× · $${values['2W'].toFixed(2)}</span></div>
    <div class="pt-item"><span class="pt-label">🎩🎩🎩 Straw Hat</span><span class="pt-val">BONUS</span></div>
  `;
}

function seededRandom(seed){
  let s = seed;

  return function(){
    s = (s * 1664525 + 1013904223) & 0xFFFFFFFF;
    return (s >>> 0) / 0xFFFFFFFF;
  };
}

function simulateSession(bankroll, numSpins, seed, bet){

  const rand = seed ? seededRandom(seed) : Math.random.bind(Math);

  const events = [];

  let balance = bankroll;
  let drySpell = 0;
  let maxDry = 0;
  let totalWon = 0;

  let wins = {
    total:0,
    '3M':0,
    '3W':0,
    '3C':0,
    '3D':0,
    '2M':0,
    '2W':0,
    bonus:0
  };

  let biggestWin = 0;
  let bonusTriggered = false;
  let firstWinSpin = null;

  for(let spin = 1; spin <= numSpins; spin++){

    if(balance < bet) break;

    balance -= bet;

    const s = [0,1,2].map(() =>
      REEL[Math.floor(rand() * REEL.length)]
    );

    let win = 0;
    let winType = null;
    let isBonus = false;

    if(s[0]==='S' && s[1]==='S' && s[2]==='S'){

      const pool = [...CHEST_POOL].sort(() => rand() - 0.5);
      const picks = pool.slice(0,3);
      const mult = picks.reduce((a,b)=>a+b,0);

      win = mult * bet;
      winType = 'bonus';
      isBonus = true;

      wins.bonus++;
      bonusTriggered = true;

    } else if(s[0]!=='B' && s[0]===s[1] && s[1]===s[2]){

      const key = '3'+s[0];

      if(PAYTABLE[key]){
        win = PAYTABLE[key] * bet;
        winType = key;
        wins[key]++;
        wins.total++;
      }

    } else if(s[0]!=='B' && s[0]===s[1] && s[2]!==s[0]){

      const key = '2'+s[0];

      if(PAYTABLE[key]){
        win = PAYTABLE[key] * bet;
        winType = key;
        wins[key]++;
        wins.total++;
      }
    }

    balance += win;
    totalWon += win;

    if(win > biggestWin){
      biggestWin = win;
    }

    if(firstWinSpin === null && win > 0){
      firstWinSpin = spin;
    }

    if(win === 0){
      drySpell++;
      if(drySpell > maxDry){
        maxDry = drySpell;
      }
    } else {
      drySpell = 0;
    }

    const isSignificant = (
      win > 0 ||
      drySpell === 15 ||
      drySpell === 25 ||
      drySpell === 35 ||
      spin === 1 ||
      spin === 10 ||
      spin === 50 ||
      spin === 100 ||
      spin === 150 ||
      spin === 200 ||
      Math.round(balance*100)/100 <= (bet * 2.5) ||
      Math.round(balance*100)/100 <= bet ||
      isBonus
    );

    if(isSignificant){

      events.push({
        spin,
        balance:Math.round(balance*100)/100,
        win:Math.round(win*100)/100,
        winType,
        isBonus,
        drySpell,
        phase:
          spin <= 50 ? 'discovery' :
          spin <= 150 ? 'calibration' :
          spin <= 300 ? 'grind' :
          'resolution'
      });
    }
  }

  const spinsPlayed = events.length;

  return {
    events,
    finalBalance:Math.round(balance*100)/100,
    startingBalance:bankroll,
    spinsPlayed,
    totalWon:Math.round(totalWon*100)/100,
    totalWagered:
  Math.round(events.length * bet * 100) / 100,

realizedRTP:
  Math.round(
    (totalWon / (events.length * bet)) * 10000
  ) / 100,
    maxDrySpell:maxDry,
    wins,
    biggestWin:Math.round(biggestWin*100)/100,
    bonusTriggered,
    firstWinSpin
  };
}

// ───────────────── CLAUDE ─────────────────

async function callClaude(sessionData, detail, bet){

  const systemPrompt = `
You are Marco, a 28-year-old One Piece fan playing Grand Line Reels.

Write a first-person emotional session narrative.
Use emotional tags:
[CURIOUS]
[EXCITED]
[RELIEF]
[FOCUSED]
[TENSE]
[FRUSTRATED]
[ELATED]
[RESIGNED]

After the narrative include:
EMOTIONAL ARC ANALYSIS
`;

  const userPrompt = `
GAME: Grand Line Reels
BET: $${bet.toFixed(2)} per spin

STARTING BANKROLL: $${sessionData.startingBalance}
SPINS PLAYED: ${sessionData.spinsPlayed}
FINAL BALANCE: $${sessionData.finalBalance}
TOTAL WAGERED: $${sessionData.totalWagered}
RTP: ${sessionData.realizedRTP}%

EVENTS:
${sessionData.events.map(e => `
Spin ${e.spin}
Balance: $${e.balance}
${e.win > 0 ? `Win: $${e.win}` : `Dry Spell: ${e.drySpell}`}
`).join('\n')}
`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':document.getElementById('api-key').value.trim(),
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:1000,
      system:systemPrompt,
      messages:[
        {
          role:'user',
          content:userPrompt
        }
      ]
    })
  });

  const data = await response.json();

  if(data.error){
    throw new Error(data.error.message);
  }

  return data.content[0].text;
}

// ───────────────── RENDER ─────────────────

function renderSummary(session){

  const grid = document.getElementById('summary-grid');

  grid.innerHTML = [

    {label:'Spins Played', val:session.spinsPlayed},
    {label:'Final Balance', val:'$'+session.finalBalance},
    {label:'Realized RTP', val:session.realizedRTP + '%'},
    {label:'Biggest Win', val:'$'+session.biggestWin},
    {label:'Longest Dry Spell', val:session.maxDrySpell},
    {label:'Bonus Triggered', val:session.bonusTriggered ? 'YES' : 'NO'},
    {label:'Total Wins', val:session.wins.total}

  ].map(s => `
    <div class="summary-stat">
      <span class="s-label">${s.label}</span>
      <span class="s-val">${s.val}</span>
    </div>
  `).join('');
}

function parseAndRenderNarrative(text){

  const parts = text.split('EMOTIONAL ARC ANALYSIS');

  const narrativeText = parts[0] || '';
  const arcText = parts[1] || '';

  const narrativeEl = document.getElementById('narrative');

  const emotionMap = {
    '[CURIOUS]':'em-curious',
    '[EXCITED]':'em-excited',
    '[RELIEF]':'em-relief',
    '[FOCUSED]':'em-focused',
    '[TENSE]':'em-tense',
    '[FRUSTRATED]':'em-frustrated',
    '[ELATED]':'em-elated',
    '[RESIGNED]':'em-resigned'
  };

  narrativeEl.innerHTML = narrativeText
    .split('\n')
    .filter(l => l.trim())
    .map(line => {

      let cls = 'event';
      let html = line;

      Object.entries(emotionMap).forEach(([tag, emCls]) => {

        if(line.includes(tag)){

          html = line.replace(
            tag,
            `<span class="emotion-tag ${emCls}">
              ${tag.replace(/[\[\]]/g,'')}
            </span>`
          );

          if(
            emCls.includes('relief') ||
            emCls.includes('excited') ||
            emCls.includes('elated')
          ){
            cls += ' win';
          }

          if(
            emCls.includes('tense') ||
            emCls.includes('frustrated')
          ){
            cls += ' loss';
          }
        }
      });

      return `<div class="${cls}">${html}</div>`;
    }).join('');

  document.getElementById('arc-text').innerHTML =
    arcText
      .split('\n')
      .filter(l => l.trim())
      .map(l => `<p style="margin-bottom:12px">${l}</p>`)
      .join('');
}

// ───────────────── MAIN ─────────────────

async function runSimulation(){

  const bankroll = parseFloat(
    document.getElementById('bankroll').value
  ) || 100;

  const bet = parseFloat(
    document.getElementById('bet-size').value
  );

  const numSpins = parseInt(
    document.getElementById('num-spins').value
  ) || 300;

  const seedVal = parseInt(
    document.getElementById('seed').value
  ) || null;

  const detail = document.getElementById('detail').value;

  const btn = document.getElementById('run-btn');
  const status = document.getElementById('status');
  const output = document.getElementById('output');

  const apiKey = document.getElementById('api-key').value.trim();

  if(!apiKey || !apiKey.startsWith('sk-ant-')){
    status.textContent = 'Please enter a valid Anthropic API key.';
    return;
  }

  btn.disabled = true;
  output.classList.add('hidden');

  status.innerHTML = `
    <div class="dot-loader">
      <span></span><span></span><span></span>
    </div>
    Simulating session...
  `;

  try {

    const session = simulateSession(
      bankroll,
      numSpins,
      seedVal,
      bet
    );

    renderSummary(session);

    status.innerHTML = `
      <div class="dot-loader">
        <span></span><span></span><span></span>
      </div>
      Marco is writing...
    `;

    const narrative = await callClaude(
      session,
      detail,
      bet
    );

    parseAndRenderNarrative(narrative);

    output.classList.remove('hidden');

    status.textContent =
      `Session complete. ${session.spinsPlayed} spins simulated.`;

  } catch(err){

    status.textContent = 'Error: ' + err.message;
    console.error(err);

  } finally {

    btn.disabled = false;
  }
}

// ───────────────── INIT ─────────────────

document.getElementById('bet-size')
  .addEventListener('change', (e) => {
    updatePaytableDisplay(parseFloat(e.target.value));
  });

updatePaytableDisplay(1);

</script>

</body>
</html>
